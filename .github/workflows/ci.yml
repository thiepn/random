name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: randomizer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Syntax check
        run: |
          node --check src/random-core.js
          node --check src/icon-system.js
          node --check src/tool-engine.js
          node --check src/selection-model.js
          node --check src/dice-engine.js
          node --check src/number-engine.js
          node --check src/pool-model.js
          node --check src/rule-model.js
          node --check src/constraint-engine.js
          node --check src/session-model.js
          node --check src/presentation-engine.js
          node --check src/preset-model.js
          node --check src/session-template-model.js
          node --check src/party-model.js
          node --check src/custom-experience-model.js
          node --check src/custom-engine.js
          node --check src/workflow-model.js
          node --check src/data-portability.js
          node --check src/performance-model.js
          node --check src/compute-tasks.js
          node --check src/worker-client.js
          node --check src/accessibility-i18n.js
          node --check src/visual-preferences.js
          node --check src/visual-boot.js
          node --check src/security.js
          node --check src/compute-worker.js
          node --check src/storage.js
          node --check src/registry.js
          node --check src/app.js
          node --check sw.js

      - name: Random Core certification
        run: node tests/random-core.mjs

      - name: Tool engine certification
        run: node tests/tool-engine.mjs

      - name: Selection model certification
        run: node tests/selection-model.mjs

      - name: Dice expression certification
        run: node tests/dice-engine.mjs

      - name: Number engine certification
        run: node tests/number-engine.mjs

      - name: Pool model certification
        run: node tests/pool-model.mjs

      - name: Rule model certification
        run: node tests/rule-model.mjs

      - name: Constraint engine certification
        run: node tests/constraint-engine.mjs

      - name: Session model certification
        run: node tests/session-model.mjs

      - name: Presentation engine certification
        run: node tests/presentation-engine.mjs

      - name: Presentation registry certification
        run: node tests/presentation-registry.mjs

      - name: Preset and Rule Set certification
        run: node tests/preset-model.mjs

      - name: Session Template certification
        run: node tests/session-template-model.mjs

      - name: Party privacy and progression certification
        run: node tests/party-model.mjs

      - name: Custom Experience model certification
        run: node tests/custom-experience-model.mjs

      - name: Custom Experience engine certification
        run: node tests/custom-engine.mjs

      - name: Decision Studio workflow certification
        run: node tests/workflow-model.mjs

      - name: Persistence and portability certification
        run: node tests/data-portability.mjs

      - name: Performance policy certification
        run: node tests/performance-model.mjs

      - name: Large-scale storage regression certification
        run: node tests/storage-scale.mjs

      - name: Accessibility and regional-format certification
        run: node tests/accessibility-i18n.mjs

      - name: Accessibility interaction regression certification
        run: node tests/accessibility-regression.mjs

      - name: Background compute equivalence certification
        run: node tests/compute-tasks.mjs

      - name: Security, privacy and integrity certification
        run: node tests/security.mjs

      - name: Offline shell certification
        run: node tests/offline-shell.mjs

      - name: Performance budget certification
        run: node tests/performance-budget.mjs

      - name: Guard decision randomness and unsafe execution
        run: |
          if grep -R "Math\.random" --include="*.js" src sw.js; then
            echo "Math.random is forbidden in production JavaScript."
            exit 1
          fi
          if grep -R -E "eval\(|new Function\(|document\.write\(|\.innerHTML\s*=|\.outerHTML\s*=|insertAdjacentHTML\(" --include="*.js" src sw.js; then
            echo "Unsafe dynamic execution or HTML injection is forbidden."
            exit 1
          fi


  production-certify:
    name: Production release certification
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Cross-feature release regression certification
        run: node tests/cross-feature-regression.mjs

      - name: Adversarial fuzz certification
        run: node tests/adversarial-fuzz.mjs

      - name: Version baseline certification
        run: node tests/version-baseline.mjs

      - name: Visual redesign contract certification
        run: node tests/visual-redesign-contract.mjs

      - name: Design System V2 certification
        run: node tests/design-system-v2.mjs

      - name: Brand and iconography V3 certification
        run: node tests/brand-iconography-v3.mjs

      - name: Adaptive shell V4 certification
        run: node tests/adaptive-shell-v4.mjs

      - name: Home and Arcade V5 certification
        run: node tests/home-arcade-v5.mjs

      - name: Tool Experience V6 certification
        run: node tests/tool-experience-v6.mjs

      - name: Results and Motion V7 certification
        run: node tests/results-motion-v7.mjs

      - name: Professional Surfaces V8 certification
        run: node tests/professional-surfaces-v8.mjs

      - name: Themes & Visual Resilience V9 certification
        run: node tests/themes-resilience-v9.mjs

      - name: Final Visual QA & v1.1 Readiness V10 certification
        run: node tests/visual-release-v10.mjs

      - name: R1 Visual Audit & Art Direction Lock certification
        run: node tests/redesign-r1-contract.mjs

      - name: R2 Visual System 3.0 & Component Materials certification
        run: node tests/redesign-r2-system.mjs

      - name: Production release certification
        run: node tests/release-certification.mjs

  release:
    name: Versioned GitHub release
    needs: production-certify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout certified commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish semantic version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not a semantic version: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"
          NOTES="RELEASE-NOTES-$TAG.md"

          if [[ ! -f "$NOTES" ]]; then
            echo "Release notes are missing: $NOTES"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub Release; nothing to publish."
            exit 0
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG exists without a GitHub Release; refusing to retarget it."
            exit 1
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Randomizer Arcade $TAG" \
            --notes-file "$NOTES"
